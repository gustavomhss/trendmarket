receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${OTELCOL_LISTEN_ADDR:0.0.0.0}:4317
      http:
        endpoint: ${OTELCOL_LISTEN_ADDR:0.0.0.0}:4318

processors:
  memory_limiter:
    check_interval: 2s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    send_batch_size: 8192
    timeout: 2s
  tailsampling:
    decision_wait: 5s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: always_sample_10pct
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
      - name: error_spans
        type: status_code
        status_code:
          status_codes: [ ERROR ]
      - name: slow_spans
        type: latency
        latency:
          threshold_ms: ${TAIL_SLOW_MS:100}

exporters:
  otlp/tempo:
    endpoint: ${TEMPO_OTLP_ENDPOINT:http://localhost:4317}
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch, tailsampling ]
      exporters: [ otlp/tempo ]

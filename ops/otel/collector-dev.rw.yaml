extensions:
  health_check:
    endpoint: 127.0.0.1:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTELCOL_LISTEN_ADDR}:4317
      http:
        endpoint: ${env:OTELCOL_LISTEN_ADDR}:4318
processors:
  memory_limiter:
    check_interval: 2s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    send_batch_size: 8192
    timeout: 2s
  resource:
    attributes:
      - key: service.name
        value: ce-app
        action: upsert
      - key: service.namespace
        value: credit-engine
        action: upsert
  tail_sampling:
    decision_wait: 5s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: baseline_10pct
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
      - name: status_error_100pct
        type: status_code
        status_code:
          status_codes: [ ERROR ]
      - name: slow_over_250ms
        type: latency
        latency:
          threshold_ms: 250
exporters:
  otlphttp/tempo:
    endpoint: http://127.0.0.1:4318
    tls:
      insecure: true
  otlp/tempo_grpc:
    endpoint: 127.0.0.1:4317
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://127.0.0.1:9090/api/v1/write
service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 127.0.0.1:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, tail_sampling]
      exporters: [otlphttp/tempo, otlp/tempo_grpc]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]

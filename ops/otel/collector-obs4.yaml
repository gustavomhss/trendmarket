receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${OTELCOL_LISTEN_ADDR:0.0.0.0}:${OTLP_GRPC_PORT:4317}
      http:
        endpoint: ${OTELCOL_LISTEN_ADDR:0.0.0.0}:${OTLP_HTTP_PORT:4318}

processors:
  memory_limiter:
    check_interval: 2s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    send_batch_size: 8192
    timeout: 2s
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 1000
    policies:
      - name: baseline-sample
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
      - name: error-traces
        type: status_code
        status_code:
          status_codes: [ ERROR ]
      - name: slow-critical-traces
        type: latency
        latency:
          threshold_ms: ${TAIL_SLOW_MS:200}

exporters:
  otlphttp/tempo:
    endpoint: ${TEMPO_OTLP_HTTP:http://localhost:4318}
  otlphttp/jaeger:
    endpoint: ${JAEGER_OTLP_HTTP:http://localhost:4318}
  debug:
    verbosity: detailed

service:
  telemetry:
    logs:
      level: info
    metrics:
      address: ${OTELCOL_METRICS_ADDR:0.0.0.0}:${OTELCOL_METRICS_PORT:8888}
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, tail_sampling, batch ]
      exporters: [ otlphttp/tempo, otlphttp/jaeger, debug ]

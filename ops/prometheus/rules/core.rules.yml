groups:
  - name: ce_core_latency
    interval: 30s
    rules:
      - record: ce:amm_op_latency_seconds:p75
        expr: |
          histogram_quantile(
            0.75,
            sum by (le, op, service) (
              rate(amm_op_latency_seconds_bucket[5m])
            )
          )
      - record: ce:amm_op_latency_seconds:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, op, service) (
              rate(amm_op_latency_seconds_bucket[5m])
            )
          )
      - record: ce:amm_op_latency_seconds:avg_by_op
        expr: |
          sum by (op) (
            rate(amm_op_latency_seconds_sum[5m])
          )
          /
          sum by (op) (
            rate(amm_op_latency_seconds_count[5m])
          )
  - name: ce_hooks
    interval: 30s
    rules:
      - record: ce:hook_executions_total:rate5m
        expr: rate(hook_executions_total[5m])
  - name: ce-core-data
    rules:
      - record: ce:data_freshness_seconds:max_by_source
        expr: max by (source) (data_freshness_seconds)

# Prometheus configuration for production CreditEngine CE stack.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    env: prod
    stack: ce
rule_files:
  - rules/core.rules.yml
scrape_configs:
  - job_name: ce-app
    scrape_timeout: 10s
    file_sd_configs:
      - files:
          - targets-prod.json
        refresh_interval: 30s
    metric_relabel_configs:
      - action: labeldrop
        regex: instance|pod|container|namespace|endpoint
  - job_name: otelcol
    scrape_timeout: 10s
    file_sd_configs:
      - files:
          - targets-otelcol-prod.json
        refresh_interval: 30s
    metric_relabel_configs:
      - action: labeldrop
        regex: instance|pod|container|namespace|endpoint

global:
  scrape_interval: 15s
  evaluation_interval: 30s
external_labels:
  env: dev
  stack: ce
rule_files:
  - rules/core.rules.yml
scrape_configs:
  - job_name: ce-app
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:9464']
        labels:
          service: ce-core
          env: dev
    metric_relabel_configs:
      - action: labeldrop
        regex: '^(instance|pod|container|namespace|endpoint)$'
  - job_name: otelcol
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:8888']
        labels:
          service: otelcol
          env: dev
    metric_relabel_configs:
      - action: labeldrop
        regex: '^(instance|pod|container|namespace|endpoint)$'

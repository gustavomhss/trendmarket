# cargo manifest canonicalizado — OTEL 0.29 (http-proto), vendors via [patch.crates-io]

[package]
name = "credit-engine-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
httpdate = "1"
http = "1"
metrics = "0.21"
metrics-exporter-prometheus = { version = "0.13", optional = true }
once_cell = "1"
opentelemetry = { version = "0.29", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.29", default-features = false, features = ["http-proto", "metrics", "reqwest-client", "trace"] }
opentelemetry-otlp = { version = "0.29", default-features = false, features = ["grpc-tonic", "http", "http-proto", "metrics", "reqwest-client", "trace"] }
opentelemetry-http = "0.29"
opentelemetry-prometheus = "0.29.1"
opentelemetry_sdk = { version = "0.29", features = ["trace", "metrics", "rt-tokio", "testing"] }
prometheus = "0.14"
regex = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tracing = "0.1"
tracing-core = "0.1.34"
tracing-opentelemetry = "0.30"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uint = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
opentelemetry = { version = "0.29.1", features = ["testing"] }
opentelemetry_sdk = { version = "0.29.0", features = ["testing"] }
proptest = "1"

[features]
default = []
# expõe o HTTP /metrics via metrics-exporter-prometheus
obs = ["metrics-exporter-prometheus"]
# habilita o transporte gRPC do exporter OTLP (opcional)
grpc-tonic = ["opentelemetry-otlp/grpc-tonic"]
# atalho para habilitar métricas OTLP em gRPC
metrics-otlp-grpc = ["grpc-tonic"]

[lib]
name = "credit_engine_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "telemetry_smoke"
path = "src/bin/telemetry_smoke.rs"
required-features = ["obs"]

[[bench]]
name = "bench_swap"
harness = false

[[bench]]
name = "bench_liquidity"
harness = false

# redireciona crates de crates.io para os vendors locais
[patch.crates-io]
hyper-timeout = { path = "vendor/hyper-timeout" }
httpdate = { path = "vendor/httpdate" }
metrics = { path = "vendor/metrics" }
metrics-exporter-prometheus = { path = "vendor/metrics-exporter-prometheus" }
opentelemetry-prometheus = { path = "vendor/opentelemetry-prometheus" }
prometheus = { path = "vendor/prometheus" }

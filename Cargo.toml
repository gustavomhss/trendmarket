[package]
name = "credit-engine-core"
version = "0.1.0"
edition = "2021"

autobins = false
[dependencies]
anyhow = "1"




once_cell = { version = "1", optional = true }
opentelemetry = { version = "0.29", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.29", features = ["http-proto"] }
opentelemetry-prometheus = { version = "0.29", optional = true }
opentelemetry_sdk = { version = "0.29", features = ["metrics", "rt-tokio"] }
prometheus = { version = "0.13", optional = true }
tiny_http = { version = "0.12", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-opentelemetry = "0.30"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uint = "0.9"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false }

# (removed) golden_runner bin block




[lib]
name = "credit_engine_core"
path = "src/lib.rs"
crate-type = ["rlib"]




[[bench]]
name = "bench_swap"
harness = false

[[bench]]
name = "bench_liquidity"
harness = false
[features]
default = []
obs = [
 "dep:once_cell",
 "dep:tiny_http",
 "dep:prometheus",
 "dep:opentelemetry-prometheus"
]
[[bin]]
name = "obs_demo"
path = "src/bin/obs_demo.rs"
required-features = ["obs"]

[[bin]]
name = "telemetry_smoke"
path = "src/bin/telemetry_smoke.rs"
required-features = ["obs"]

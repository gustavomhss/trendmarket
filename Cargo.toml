[package]
name = "credit-engine-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
httpdate = { version = "1", path = "vendor/httpdate" }
opentelemetry = { version = "0.29", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.29", features = ["http-proto"] }
opentelemetry-prometheus = { version = "0.29", path = "vendor/opentelemetry-prometheus" }
opentelemetry_sdk = { version = "0.29", features = ["metrics", "rt-tokio", "testing"] }
prometheus = { version = "0.13", path = "vendor/prometheus" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-opentelemetry = "0.30"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uint = "0.9"

[patch.crates-io]
httpdate = { path = "vendor/httpdate" }
prometheus = { path = "vendor/prometheus" }
opentelemetry-prometheus = { path = "vendor/opentelemetry-prometheus" }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false }
once_cell = "1"
regex = "1"
[lib]
name = "credit_engine_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bench]]
name = "bench_swap"
harness = false

[[bench]]
name = "bench_liquidity"
harness = false

[features]
obs = []

[[bin]]
name = "telemetry_smoke"
path = "src/bin/telemetry_smoke.rs"
required-features = ["obs"]

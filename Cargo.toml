[package]
name = "credit-engine-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
opentelemetry = { version = "0.29", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.29", features = ["http-proto"] }
opentelemetry_sdk = { version = "0.29", features = ["metrics", "rt-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tracing = "0.1"
tracing-opentelemetry = "0.30"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uint = "0.9"
metrics = { version = "0.21", path = "vendor/metrics" }
metrics-exporter-prometheus = { version = "0.13", optional = true, path = "vendor/metrics-exporter-prometheus" }
serde_json = "1"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false }
once_cell = "1"
regex = "1"
[lib]
name = "credit_engine_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bench]]
name = "bench_swap"
harness = false

[[bench]]
name = "bench_liquidity"
harness = false

[[bin]]
name = "telemetry_smoke"
path = "src/bin/telemetry_smoke.rs"
required-features = ["obs"]

[features]
obs = [
  "metrics-exporter-prometheus"
]

[package]
name = "credit-engine-core"
version = "0.1.0"
edition = "2021"

autobins = false

[dependencies]
anyhow = "1"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
once_cell = { version = "1", optional = true }
opentelemetry = { version = "0.29", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.29", features = ["http-proto"] }
opentelemetry-prometheus = { version = "0.29", optional = true }
opentelemetry_sdk = { version = "0.29", features = ["metrics", "rt-tokio"] }
prometheus = { version = "0.14", optional = true }
tiny_http = { version = "0.12", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-opentelemetry = "0.30"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uint = "0.9"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false }

[lib]
name = "credit_engine_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bench]]
name = "bench_swap"
harness = false

[[bench]]
name = "bench_liquidity"
harness = false

[features]
default = []
obs = ["once_cell", "tiny_http", "prometheus", "opentelemetry-prometheus"]
once_cell = ["dep:once_cell"]
tiny_http = ["dep:tiny_http"]
prometheus = ["dep:prometheus"]
opentelemetry-prometheus = ["dep:opentelemetry-prometheus"]

[[bin]]
name = "obs_demo"
path = "src/bin/obs_demo.rs"
required-features = ["obs"]

[[bin]]
name = "telemetry_smoke"
path = "src/bin/telemetry_smoke.rs"
required-features = ["obs"]


name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-a110:
    name: Gate A110 validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate watchers and hooks
        run: |
          set -o pipefail
          ./ops/scripts/gate_a110.sh --check | tee gate_a110.log

      - name: Upload Gate A110 report
        uses: actions/upload-artifact@v4
        with:
          name: gate-a110-report
          path: gate_a110.log

  sbom:
    name: SBOM snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SBOM report
        run: |
          python - <<'PY'
import json
import hashlib
import os
from pathlib import Path

root = Path('.')
exclude_dirs = {'.git', 'artifacts'}
entries = []
for path in sorted(root.rglob('*')):
    if path.is_dir():
        continue
    if any(part in exclude_dirs for part in path.parts):
        continue
    digest = hashlib.sha256(path.read_bytes()).hexdigest()
    entries.append({
        "path": str(path),
        "sha256": digest,
        "size": path.stat().st_size,
    })

sbom_dir = Path('artifacts')
sbom_dir.mkdir(exist_ok=True)
report = {
    "repository": os.environ.get('GITHUB_REPOSITORY', ''),
    "commit": os.environ.get('GITHUB_SHA', ''),
    "entries": entries,
}
with (sbom_dir / 'sbom.json').open('w', encoding='utf-8') as fh:
    json.dump(report, fh, indent=2)
PY

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-scan
          path: artifacts/sbom.json

name: CI
on:
  push:
    branches: [ main, '*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests (all features)
        run: |
          set -o pipefail
          cargo test --all-features --verbose 2>&1 | tee ci_cargo_test.txt

      - name: Bench (smoke, if benches exist)
        run: |
          if [ -d bench ] || [ -d benches ]; then
            cargo bench 2>&1 | tee ci_cargo_bench.txt || true
          else
            echo "No benches/; skipping" | tee ci_cargo_bench.txt
          fi

      - name: ORR (best-effort): gerar artefatos se scripts existirem
        run: |
          mkdir -p out/orr_gatecheck/logs out/orr_gatecheck/evidence out/orr_gatecheck/docs
          if [ -f scripts/orr_scan_static.py ]; then python3 scripts/orr_scan_static.py || true; fi
          if [ -f scripts/orr_t2_parse_unit.py ]; then python3 scripts/orr_t2_parse_unit.py || true; fi
          if [ -f scripts/orr_t4_goldens_run.sh ]; then bash scripts/orr_t4_goldens_run.sh || true; fi
          if [ -f scripts/orr_t5_collect_criterion.py ]; then python3 scripts/orr_t5_collect_criterion.py || true; fi

      - name: Upload artifacts (logs + ORR evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orr-ci-artifacts
          path: |
            ci_cargo_test.txt
            ci_cargo_bench.txt
            out/orr_gatecheck/**
